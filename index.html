<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Breakpoint Social | San Diego Social Media Agency</title>
    <meta
      name="description"
      content="Breakpoint Social is a San Diego social media and influencer marketing agency. We engineer campaigns that spark movements, not just posts."
    />

    <link rel="icon" type="image/png" href="https://breakpointsocial.com/wp-content/uploads/2025/04/breakpoint-favicon-300x300.png" />

    <!--
      og:title, og:url, og:image, canonical and the JSON-LD block are injected
      per route by prerender.js. They are deliberately absent here: a static
      copy would duplicate the generated one, and a crawler reading two
      conflicting og:title tags picks whichever it likes.
    -->
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      The four faces the design system uses. display=swap so text paints
      immediately in the fallback rather than sitting invisible.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
